# 递归会话规程投影复核器
#
# 用法：
#   APP_PORT=8080 docker compose up --exit-code-from verify
# verify 容器执行投影规则测试、前端构建，并对 app 的健康地址与演练结果做 HTTP 冒烟，
# 完成后以退出码结束（0 为全部通过）。

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
    ports:
      # 对外端口可通过 APP_PORT 环境变量配置，健康地址为 http://localhost:${APP_PORT}/health
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:8080
